# ─────────────────────────────────────────────────────────────────
# Decap CMS configuration for jpwolfson.com
# ─────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: jpwolfson/jpwolfson-site
  branch: main
  base_url: https://jpwolfson-cms-auth.jpwolfson.workers.dev
  auth_endpoint: /oauth/authorize

publish_mode: simple

media_folder: src/files
public_folder: /files

collections:
  # ── Single pages (one file each) ──────────────────────────────
  - name: pages
    label: Pages
    files:

      - name: about
        label: About Me
        file: src/content/about.md
        fields:
          - { label: Layout, name: layout, widget: hidden, default: base.njk }
          - { label: Title, name: title, widget: hidden, default: About Me }
          - { label: Permalink, name: permalink, widget: hidden, default: / }
          - { label: Body, name: body, widget: markdown }

      - name: papers
        label: Papers
        file: src/content/papers.md
        fields:
          - { label: Layout, name: layout, widget: hidden, default: base.njk }
          - { label: Title, name: title, widget: hidden, default: Papers }
          - { label: Permalink, name: permalink, widget: hidden, default: /papers/ }
          - { label: Body, name: body, widget: markdown }

