name: Link Audit

# Checks every external link in the site content. A broken link opens or
# updates a tracking issue instead of leaving a permanently red run; the job
# itself fails only if the crawler crashes. Holds no secrets.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jpwolfson-site/src/**'
      - 'jpwolfson-site/scripts/crawl_links.py'

permissions:
  contents: read
  issues: write

concurrency:
  group: link-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jpwolfson-site

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: pip install -r scripts/requirements-ci.txt

      - name: Run link audit
        id: crawl
        continue-on-error: true
        run: python scripts/crawl_links.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: link-audit-results
          path: jpwolfson-site/link_audit.json
          retention-days: 90

      - name: Summarize and track broken links in an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
        run: |
          python - <<'EOF2'
          import json, os, subprocess, sys
          try:
              data = json.load(open("link_audit.json"))
          except Exception as e:
              print(f"Crawler produced no readable output ({e}); outcome={os.environ['CRAWL_OUTCOME']}")
              sys.exit(1)
          s = data["summary"]
          broken = [r for r in data["links"] if r["classification"] == "broken"]
          lines = ["## Link Audit Results", "",
                   f"Checked **{s['total_unique_urls']}** unique URLs ({s['total_raw_instances']} raw instances)", "",
                   "| Classification | Count |", "|---|---|"]
          for k, v in sorted(s.get("by_classification", {}).items()):
              lines.append(f"| {k} | {v} |")
          if broken:
              lines += ["", "### Broken links"]
              for r in broken:
                  occ = r["occurrences"][0]
                  lines.append(f"- `{r['url']}` — {occ['source_file']}:{occ['line']}")
          body = "\n".join(lines)
          print(body)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(body + "\n")

          title = "Link audit: broken links"
          lookup = subprocess.run(
              ["gh", "issue", "list", "--state", "open", "--search", f'"{title}" in:title', "--json", "number", "--jq", ".[0].number"],
              capture_output=True, text=True)
          if lookup.returncode != 0:
              print("gh issue list failed; not touching issues:", lookup.stderr); sys.exit(1)
          existing = lookup.stdout.strip().strip('"')
          if existing in ("", "null"):
              existing = ""

          if broken:
              if existing:
                  subprocess.run(["gh", "issue", "edit", existing, "--body", body], check=True)
              else:
                  subprocess.run(["gh", "issue", "create", "--title", title, "--body", body], check=True)
          elif existing:
              subprocess.run(["gh", "issue", "close", existing, "--comment", "All links resolve again."], check=True)
          EOF2
